<svg viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151c"/>
      <stop offset="100%" stop-color="#181d27"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fc3e0"/>
      <stop offset="100%" stop-color="#2fd9b0"/>
    </linearGradient>
    <filter id="wordGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="400" fill="url(#bgGrad)"/>

  <!-- document page, tilted -->
  <g transform="rotate(-5 370 200)">
    <rect x="120" y="40" width="500" height="320" rx="16" fill="#181c25" stroke="#262c38" stroke-width="2"/>

    <!-- text lines -->
    <rect x="150" y="74" width="260" height="12" rx="6" fill="#3c4250"/>
    <rect x="150" y="109" width="420" height="12" rx="6" fill="#3c4250"/>
    <rect x="150" y="144" width="340" height="12" rx="6" fill="#3c4250"/>

    <!-- highlighted line band -->
    <rect x="135" y="170" width="450" height="30" rx="7" fill="#d9a24a"/>
    <!-- glowing word -->
    <rect x="330" y="173" width="110" height="24" rx="6" fill="#ff7a29" filter="url(#wordGlow)" opacity="0.85"/>
    <rect x="330" y="173" width="110" height="24" rx="6" fill="#ff8f3d"/>

    <rect x="150" y="214" width="380" height="12" rx="6" fill="#3c4250"/>
    <rect x="150" y="249" width="300" height="12" rx="6" fill="#3c4250"/>
    <rect x="150" y="284" width="400" height="12" rx="6" fill="#3c4250"/>
    <rect x="150" y="319" width="250" height="12" rx="6" fill="#3c4250"/>
  </g>

  <!-- radiating sound arcs -->
  <g fill="none" stroke="url(#waveGrad)" stroke-linecap="round">
    <path d="M 686 150 A 80 80 0 0 1 686 241" stroke-width="4" opacity="0.85"/>
    <path d="M 743 109 A 150 150 0 0 1 743 282" stroke-width="3" opacity="0.5"/>
    <path d="M 800 69 A 220 220 0 0 1 800 322" stroke-width="2" opacity="0.28"/>
  </g>
</svg>
