name: Feature request
description: Suggest an idea — a new backend, a UI improvement, anything
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that the app doesn't support today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: |
        If this is a new TTS engine or PDF converter, note whether it needs a
        heavy dependency (model weights, GPU) — that affects whether it should
        be opt-in via requirements-optional.txt, matching the existing pattern.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today, or other approaches you thought about.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — links, screenshots, related issues.
